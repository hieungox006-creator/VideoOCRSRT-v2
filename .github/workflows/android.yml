
name: Build VideoOCRSRT APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q VideoOCRSRT_V6_queue_thumbnails_duration.zip -d source

      - name: Build APK
        run: |
          gradle -p source/VideoOCRSRT_V6/VideoOCRSRT --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoOCRSRT-debug-apk
          path: source/VideoOCRSRT_V6/VideoOCRSRT/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
